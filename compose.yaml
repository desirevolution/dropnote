# Run Dropnote from GitHub Container Registry: `docker compose up -d`.
# Copy .env.example to .env to select a release or configure the service.

services:
  dropnote:
    image: ghcr.io/desirevolution/dropnote:${DROPNOTE_VERSION:-0.1.0}
    ports:
      - "${DROPNOTE_PORT:-8080}:${PORT:-3000}"
    env_file:
      - path: .env
        required: false
    environment:
      BASE_URL: ${BASE_URL:-http://localhost:${DROPNOTE_PORT:-8080}}
    volumes:
      - dropnote-data:/app/data
    restart: unless-stopped

volumes:
  dropnote-data:
