
name: Publish Docker image

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Read release version
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          version_pattern='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          version="${RELEASE_TAG#v}"

          if [[ ! "$RELEASE_TAG" =~ $version_pattern || ${#version} -gt 128 ]]; then
            echo '::error::Use a release tag such as v0.1.0 or v0.2.0-rc.1.'
            exit 1
          fi

          image="ghcr.io/${GITHUB_REPOSITORY,,}"

          {
            printf 'image=%s\n' "$image"
            printf 'version=%s\n' "$version"
            printf 'tags<<EOF\n'
            printf '%s:%s\n' "$image" "$version"

            # Only stable releases receive the latest tag.
            if [[ "$IS_PRERELEASE" != "true" && "$version" != *-* ]]; then
              printf '%s:latest\n' "$image"
            fi

            printf 'EOF\n'
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}

      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the release image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.release.outputs.tags }}
          labels: |
            org.opencontainers.image.title=Dropnote
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
